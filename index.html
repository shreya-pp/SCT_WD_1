<!DOCTYPE html>
<html lang="en">

<head>

    <title>Interactive Navigation Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Menu -->
    <nav id="navbar">

        <div class="logo">
            MyWebsite
        </div>

        <ul class="menu">

            <li>
                <a href="#home">Home</a>
            </li>

            <li>
                <a href="#about">About</a>
            </li>

            <li>
                <a href="#services">Services</a>
            </li>

            <li>
                <a href="#contact">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- Home Section -->

        <h1>Home</h1>
        <p>Welcome to my website.</p>
    </section>


    <!-- About Section -->
    <section id="about">
        <h1>About</h1>
        <p>This is the About section.</p>
    </section>


    <!-- Services Section -->
    <section id="services">
        <h1>Services</h1>
        <p>These are the services we provide.</p>
    </section>


    <!-- Contact Section -->
    <section id="contact">
        <h1>Contact</h1>
        <p>Get in touch with us.</p>
    </section>
    <script src="script.js"></script>

</body>

</html>
